output_dir: ./data/corpus
total_token_cap: 300000000
tokens_per_word: 1.3
max_download_bytes: 10000000000

sources:
  pg19:
    enabled: true
    type: pg19
    token_cap: 200000000
    max_download_bytes: 6500000000
    min_words: 10000
    license: "Apache-2.0 dataset; underlying pre-1919 books are public domain"
    train_files_url: https://huggingface.co/datasets/deepmind/pg19/raw/main/data/train_files.txt
