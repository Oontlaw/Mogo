    book_base_url: https://storage.googleapis.com/deepmind-gutenberg/

  tinystories_v2_gpt4:
    enabled: true
    type: tiny_stories
    token_cap: 100000000
    max_download_bytes: 2300000000
    batch_words: 100000
    license: CDLA-Sharing-1.0
    url: https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt?download=true
